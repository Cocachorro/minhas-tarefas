<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Minhas Tarefas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Minhas Tarefas</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-label
      >@if (tarefas.length>1) {Você tem {{tarefas.length}} tarefas.}@else if(tarefas.length===0){Você não tem tarefas.}
      @else {Você tem {{tarefas.length}} tarefa.}
    </ion-label>
  </ion-item>

  <ion-list>
    @for (tarefa of tarefas; track tarefa.id){
    <ion-item>
      <ion-label position="stacked">{{tarefa.id}}</ion-label>
      <ion-checkbox
        labelPlacement="start"
        justify="start"
        [checked]="tarefa.concluido"
        (ionChange)="aoChecar(tarefa.id, $event.detail.checked)"
        [class.tarefaConcluida]="tarefa.concluido"
        >{{tarefa.titulo}}</ion-checkbox
      >
      <ion-button slot="end" (click)="removerTarefa(tarefa.id)">REMOVER</ion-button>
    </ion-item>
    }
  </ion-list>

  <ion-item>
    <ion-input [(ngModel)]="novoTitulo" placeholder="Digite aqui o novo titulo" (keyup.enter)="adicionar()"></ion-input>
  </ion-item>
  <ion-button [disabled]="novoTitulo.trim() === ''" (click)="adicionar()">Adicionar Tarefa</ion-button>
</ion-content>
