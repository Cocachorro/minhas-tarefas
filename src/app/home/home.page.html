<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Minhas Tarefas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Minhas Tarefas</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-item>
  <ion-label>@if (tarefas.length>1)
    {Você tem {{tarefas.length}} tarefas.}
    @else {Você tem {{tarefas.length}} tarefa}
  </ion-label>
</ion-item>

    <ion-list>
      @for (tarefa of tarefas; track tarefa.id){
        <ion-item>
          <ion-label position="stacked">{{tarefa.id}}</ion-label>
          <ion-checkbox labelPlacement="start" justify="start" [checked]="tarefa.concluido">{{tarefa.titulo}}</ion-checkbox>
        </ion-item>
      }
    </ion-list>
  
</ion-content>
