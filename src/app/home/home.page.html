<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Blank</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>
      @for (tarefa of tarefas; track tarefa.id){
        <ion-item>
          <ion-label position="stacked">{{tarefa.id}}</ion-label>
          <ion-checkbox labelPlacement="start" justify="start" [checked]=tarefa.concluido>{{tarefa.titulo}}</ion-checkbox>
        </ion-item>
      }
    </ion-list>
  </ion-content>
  
</ion-content>
